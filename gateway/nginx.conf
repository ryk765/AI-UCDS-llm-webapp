events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / { try_files /index.html =404; }

    location = /word-vector { return 301 /word-vector/; }
    location = /next-token  { return 301 /next-token/; }
    location = /attention   { return 301 /attention/; }
    location = /tokenizer   { return 301 /tokenizer/; }

    location /word-vector/ { proxy_pass http://word-vector:8080/; }
    location /next-token/  { proxy_pass http://next-token:8080/; }
    location /attention/   { proxy_pass http://attention:8080/; }
    location /tokenizer/   { proxy_pass http://tokenizer:8080/; }
  }
}